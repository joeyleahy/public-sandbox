<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>joeyleahy.com — projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #0C1A12;
    --plate:  #132A1D;
    --rule:   #22392A;
    --bone:   #EDEBE0;
    --dim:    #93AE9C;
    --kelly:  #4CBB17;
    --kelly-deep: #2E5C3C;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--bone);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- overgrowth ---- */

  .growth {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .growth .tree-far  { fill: var(--kelly); opacity: 0.05; }
  .growth .snow-far  { fill: var(--bone);  opacity: 0.05; }
  .growth .tree-mid  { fill: var(--kelly); opacity: 0.085; }
  .growth .snow-mid  { fill: var(--bone);  opacity: 0.10; }
  .growth .tree      { fill: var(--kelly); opacity: 0.13; }
  .growth .snow      { fill: var(--bone);  opacity: 0.20; }

  .scrim {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 78% 62% at 26% 54%,
        rgba(12,26,18,0.97) 0%,
        rgba(12,26,18,0.90) 34%,
        rgba(12,26,18,0.52) 62%,
        rgba(12,26,18,0) 84%);
  }

  header, main { position: relative; z-index: 1; }

  /* ---- header ---- */

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1.5rem clamp(1.2rem, 5vw, 3.5rem);
    border-bottom: 1px solid var(--rule);
  }

  .wordmark {
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    color: var(--bone);
    text-decoration: none;
    white-space: nowrap;
  }

  .wordmark .tld { color: var(--kelly); }
  .wordmark:hover .tld, .wordmark:focus-visible .tld { color: var(--bone); }

  .stamp {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: right;
  }

  #cycle {
    display: inline-block;
    color: var(--kelly);
    transition: opacity 260ms ease, transform 260ms ease;
  }

  #cycle.out { opacity: 0; transform: translateY(-4px); }

  /* ---- stage ---- */

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    max-width: 60rem;
    padding: 2rem clamp(1.2rem, 5vw, 3.5rem) 4rem;
  }

  .eyebrow {
    margin: 0 0 0.9rem;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--kelly);
  }

  .field {
    display: flex;
    align-items: baseline;
    gap: 0.5em;
    border-bottom: 1px solid var(--kelly-deep);
    padding-bottom: 0.2em;
    transition: border-color 160ms ease;
  }

  .field:focus-within { border-color: var(--kelly); }

  .slash {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: clamp(2rem, 7.5vw, 4rem);
    font-weight: 400;
    line-height: 1;
    color: var(--kelly);
    user-select: none;
  }

  #slug {
    flex: 1;
    min-width: 0;
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    color: var(--bone);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: clamp(2rem, 7.5vw, 4rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    caret-color: var(--kelly);
  }

  #slug:focus { outline: none; }
  #slug::placeholder { color: #3E6049; font-weight: 400; }

  .hint {
    margin: 0.9rem 0 0;
    font-size: 0.8rem;
    color: var(--dim);
    min-height: 1.2em;
    transition: color 160ms ease;
  }

  .hint[data-state="warn"] { color: var(--kelly); }

  .recent { margin-top: 3.5rem; }
  .recent[hidden] { display: none; }

  .recent-label {
    margin: 0 0 0.85rem;
    font-size: 0.66rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    background: rgba(19,42,29,0.92);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 0.45em 0.7em;
    transition: border-color 140ms ease;
  }

  .chip:hover, .chip:focus-within { border-color: var(--kelly); }

  .chip a { color: var(--bone); text-decoration: none; font-size: 0.82rem; }
  .chip:hover a, .chip a:focus-visible { color: var(--kelly); }

  .chip button {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    color: var(--rule);
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1;
  }

  .chip button:hover, .chip button:focus-visible { color: var(--kelly); }

  :focus-visible { outline: 2px solid var(--kelly); outline-offset: 3px; }

  @media (prefers-reduced-motion: no-preference) {
    .eyebrow, .field, .hint, .recent {
      animation: rise 520ms cubic-bezier(.2,.7,.3,1) both;
    }
    .eyebrow { animation-delay: 40ms; }
    .field   { animation-delay: 90ms; }
    .hint    { animation-delay: 160ms; }
    .recent  { animation-delay: 220ms; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>

<div class="scrim" aria-hidden="true"></div>

<header>
  <a class="wordmark" href="/">joeyleahy<span class="tld">.com</span></a>
  <span class="stamp"><span id="cycle">games</span></span>
</header>

<main>
  <p class="eyebrow">Open a project</p>

  <div class="field">
    <span class="slash" aria-hidden="true">/</span>
    <input id="slug"
           type="text"
           placeholder="name"
           autocomplete="off"
           autocapitalize="off"
           autocorrect="off"
           spellcheck="false"
           aria-label="Project name">
  </div>

  <p class="hint" id="hint">Type a name and press Enter.</p>

  <section class="recent" id="recent" hidden>
    <p class="recent-label">Opened from this browser</p>
    <div class="chips" id="chips"></div>
  </section>
</main>

<script>
(function () {
  var KEY   = 'projects.recent';
  var LIMIT = 10;

  var input  = document.getElementById('slug');
  var hint   = document.getElementById('hint');
  var recent = document.getElementById('recent');
  var chips  = document.getElementById('chips');

  function read() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY) || '[]');
      return Array.isArray(v) ? v.filter(function (s) { return typeof s === 'string'; }) : [];
    } catch (e) { return []; }
  }

  function save(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, LIMIT))); } catch (e) {}
  }

  function clean(raw) {
    return raw.toLowerCase().trim()
      .replace(/^\/+|\/+$/g, '')
      .replace(/[^a-z0-9\-_]/g, '');
  }

  function render() {
    var list = read();
    chips.textContent = '';

    list.forEach(function (name) {
      var chip = document.createElement('span');
      chip.className = 'chip';

      var link = document.createElement('a');
      link.href = '/' + name + '/';
      link.textContent = name;

      var drop = document.createElement('button');
      drop.type = 'button';
      drop.textContent = '\u00d7';
      drop.setAttribute('aria-label', 'Forget ' + name);
      drop.addEventListener('click', function () {
        save(read().filter(function (n) { return n !== name; }));
        render();
      });

      chip.appendChild(link);
      chip.appendChild(drop);
      chips.appendChild(chip);
    });

    recent.hidden = list.length === 0;
  }

  function go() {
    var name = clean(input.value);

    if (!name) {
      hint.textContent = 'Enter a project name.';
      hint.dataset.state = 'warn';
      return;
    }

    save([name].concat(read().filter(function (n) { return n !== name; })));
    window.location.href = '/' + name + '/';
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); go(); }
  });

  input.addEventListener('input', function () {
    hint.textContent = 'Type a name and press Enter.';
    delete hint.dataset.state;
  });

  var words = ['games', 'apps', 'systems', 'tools'];
  var cycle = document.getElementById('cycle');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)');

  if (!still.matches) {
    var i = 0;
    setInterval(function () {
      cycle.classList.add('out');
      setTimeout(function () {
        i = (i + 1) % words.length;
        cycle.textContent = words[i];
        cycle.classList.remove('out');
      }, 260);
    }, 3200);
  }

  render();
  input.focus();
})();
</script>
